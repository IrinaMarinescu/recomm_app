<div class="login-container">
  <div class="floating-hearts">
    <span class="heart">💖</span>
    <span class="heart">💕</span>
    <span class="heart">💗</span>
    <span class="heart">💓</span>
    <span class="heart">💝</span>
  </div>
  
  <mat-card class="login-card cute-card sparkle">
    <mat-card-header>
      <mat-card-title class="cute-title">
        <span class="welcome-emoji">👋</span>
        Welcome Back!
      </mat-card-title>
      <mat-card-subtitle class="cute-subtitle">
        <span class="sparkle-emoji">✨</span>
        Sign in to your magical account
        <span class="sparkle-emoji">✨</span>
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <mat-form-field appearance="outline" class="full-width cute-form-field">
          <mat-label>
            <span class="field-icon">📧</span>
            Email
          </mat-label>
          <input matInput formControlName="email" type="email" placeholder="Enter your email">
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
            <span class="error-emoji">😅</span>
            Email is required
          </mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
            <span class="error-emoji">🤔</span>
            Please enter a valid email address
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width cute-form-field">
          <mat-label>
            <span class="field-icon">🔒</span>
            Password
          </mat-label>
          <input matInput formControlName="password" type="password" placeholder="Enter your password">
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            <span class="error-emoji">😅</span>
            Password is required
          </mat-error>
          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
            <span class="error-emoji">🤔</span>
            Password must be at least 6 characters long
          </mat-error>
        </mat-form-field>

        <button 
          mat-raised-button 
          color="primary" 
          type="submit" 
          class="full-width login-button cute-button"
          [disabled]="loginForm.invalid || loading">
          <span *ngIf="!loading" class="button-content">
            <span class="button-emoji">🚀</span>
            Sign In
          </span>
          <span *ngIf="loading" class="button-content loading-dots">
            <span class="button-emoji">⏳</span>
            Signing In
          </span>
        </button>
      </form>
    </mat-card-content>

    <mat-card-actions>
      <p class="signup-link">
        <span class="link-emoji">💭</span>
        Don't have an account? 
        <a routerLink="/register" class="cute-link">
          <span class="link-emoji">🌟</span>
          Sign up here
          <span class="link-emoji">🌟</span>
        </a>
      </p>
    </mat-card-actions>
  </mat-card>
</div>
