<div class="recommendation-form-container">
  <div class="form-wrapper">
    <mat-card class="form-card">
      <mat-card-header>
        <mat-card-title>
          <mat-icon class="header-icon">recommend</mat-icon>
          Share a Recommendation
        </mat-card-title>
        <mat-card-subtitle *ngIf="userInfo">
          for {{ userInfo.name }}
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <div *ngIf="loading" class="loading-container">
          <mat-spinner diameter="40"></mat-spinner>
          <p>Loading...</p>
        </div>

        <form *ngIf="!loading && userInfo" [formGroup]="recommendationForm" (ngSubmit)="onSubmit()" class="recommendation-form">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Name of Recommendation</mat-label>
            <input matInput formControlName="name" placeholder="e.g., Amazing Coffee Shop">
            <mat-error *ngIf="recommendationForm.get('name')?.invalid && recommendationForm.get('name')?.touched">
              {{ getErrorMessage('name') }}
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Link to Recommendation</mat-label>
            <input matInput formControlName="link" placeholder="https://example.com">
            <mat-error *ngIf="recommendationForm.get('link')?.invalid && recommendationForm.get('link')?.touched">
              {{ getErrorMessage('link') }}
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Description (Optional)</mat-label>
            <textarea matInput formControlName="description" 
                      placeholder="Why should they check this out? What makes it special?"
                      rows="3"></textarea>
          </mat-form-field>

          <div class="form-actions">
            <button mat-raised-button 
                    color="primary" 
                    type="submit" 
                    [disabled]="submitting || recommendationForm.invalid"
                    class="submit-button">
              <mat-spinner *ngIf="submitting" diameter="20" class="button-spinner"></mat-spinner>
              <span *ngIf="!submitting">Submit Recommendation</span>
              <span *ngIf="submitting">Submitting...</span>
            </button>
          </div>
        </form>

        <div *ngIf="!loading && !userInfo" class="error-container">
          <mat-icon class="error-icon">error</mat-icon>
          <p>Invalid QR code or user not found.</p>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
